<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Between The Interpolated</title>
     <link rel="stylesheet" href="css/style.css">
</head>
<body>
      <div id="game-container">

    <form id="player-form">
      <label for="player-name">Name:</label>
      <input type="text" id="player-name" name="playerName" required>

        <label for="player-gender">Gender:</label>
      <select id="player-gender" name="playerGender">
        <option value="female">Female</option>
        <option value="male">Male</option>
        <option value="other">Other</option>
      </select> 
        
      <button type="submit" id="start-btn">Start Story</button>
    </form>

    <div id="story-container">
      <p id="scene-title"></p>
      <p id="story-text"></p>
      <p id="player-status"></p>
    </div>

       <div id="button-group">
      <button type="button" id="choice-1-btn" class="choice-btn">Choice 1</button>
      <button type="button" id="choice-2-btn" class="choice-btn">Choice 2</button>
    </div>
      </div>

  <script src="js/classes.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
